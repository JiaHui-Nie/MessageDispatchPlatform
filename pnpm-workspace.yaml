# pnpm 配置（pnpm 10+ 从这里读取设置）。
# esbuild 与 workerd 需要在安装时执行构建脚本，wrangler 才能正常打包与本地运行。
allowBuilds:
  esbuild: true
  workerd: true

# 由 pnpm 自动写入：这些版本发布时尚不满足默认的 minimumReleaseAge 策略。
# 具体版本已由 pnpm-lock.yaml 锁定，保留可保证 CI 可重复安装。
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261112.1'
  - miniflare@5.20261110.1-beta
  - wrangler@4.160.1
